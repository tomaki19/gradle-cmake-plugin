plugins {
  id('java-gradle-plugin')
  id('jvm-test-suite')
  id('jacoco')
  // id('signing')
  alias(libs.plugins.publish)
  alias(libs.plugins.spotless)
  alias(libs.plugins.versions)
  alias(libs.plugins.jacocolog)
}

group = 'io.github.tomaki19'
version = '0.9.7'

repositories {
  mavenCentral()
}

dependencies {
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
}

java {
  sourceCompatibility = JavaVersion.VERSION_17 // minimal java version supported by Gradle 9
}

gradlePlugin {
  website = 'https://github.com/tomaki19/gradle-cmake-plugin'
  vcsUrl = 'https://github.com/tomaki19/gradle-cmake-plugin.git'
  plugins {
    cmake {
      id = "${project.group}.${project.name}"
      displayName = 'CMake Build Plugin'
      description = 'A Gradle plugin that uses the CMake build framework for C/C++ builds.'
      tags.set(['cmake', 'build', 'native', 'c', 'cpp', 'c++'])
      implementationClass = 'io.github.tomaki19.gradle.cmake.CMakePlugin'
    }
  }
}

spotless {
  java {
    licenseHeaderFile file('gradle/license-header.txt')
    removeUnusedImports()
  }
}
tasks.withType(JavaCompile) {
  dependsOn(tasks.spotlessApply)
}

// signing {
//   required = { hasProperty('signingPassword') && gradle.taskGraph.hasTask('publish') }
//   useGpgCmd()
//   sign publishing.publications
// }

tasks.withType(Javadoc).configureEach {
  options.addStringOption('Xdoclint:-missing', '-quiet')
}

jacoco {
  toolVersion = '0.8.14'
}

jacocoTestReport {
  dependsOn test
}

test {
  finalizedBy jacocoTestReport
}

testing {
  suites {
    test {
      useJUnitJupiter()
    }
    integrationTest(JvmTestSuite) {
      dependencies {
        implementation project()
      }
      targets {
        all {
          testTask.configure {
            shouldRunAfter(tasks.test)
          }
        }
      }
    }
  }
}

tasks.check {
    dependsOn(testing.suites.integrationTest)
}

tasks.withType(AbstractPublishToMaven) {
  dependsOn(tasks.check)
}
