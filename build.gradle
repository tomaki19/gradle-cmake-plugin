plugins {
  id 'java-gradle-plugin'
  id 'com.gradle.plugin-publish' version '1.3.1'
  id 'com.diffplug.spotless' version '7.0.3'
}

repositories {
  mavenCentral()
}

dependencies {
  testImplementation libs.junit
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
}

spotless {
  java {
    licenseHeaderFile file('gradle/license-header.txt')
    removeUnusedImports()
  }
}

group = 'ch.tomaki'
version = '1.0.0'

gradlePlugin {
  website = 'https://github.com/tomaki19/gradle-cmake-plugin'
  vcsUrl = 'https://github.com/tomaki19/gradle-cmake-plugin.git'
  plugins {
    simplePlugin {
      id = "${project.group}.${project.name}"
      displayName = 'CMake Build Plugin'
      description = 'A Gradle plugin that uses the CMake build framework for C/C++ builds.'
      tags.set(['gradle', 'cmake', 'c', 'cpp', 'c++'])
      implementationClass = 'ch.tomaki.gradle.cmake.CMakePlugin'
    }
  }
}

test {
  useJUnitPlatform()
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

tasks.withType(AbstractPublishToMaven) {
  dependsOn check
}
